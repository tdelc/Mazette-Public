# L'import des données, chaque matin (cf. docs/maintenance.md).
#
# Déclenché par Google Apps Script (workflow_dispatch), qui tient l'heure : le
# `schedule` de GitHub peut prendre plusieurs heures de retard et ne reste ici
# qu'en filet. Sur un dépôt public, GitHub désactive aussi les workflows
# planifiés après 60 jours sans commit ; workflow_dispatch n'est pas concerné.
#
# Les journaux de ce dépôt sont PUBLICS : import_quotidien.R détourne la trace
# de l'import et ne publie qu'un résumé sans montant, et il n'y a ici aucun
# upload-artifact (le .RData contient toute la comptabilité).
name: Import quotidien

on:
  schedule:
    # Filet seulement ; sans danger grâce à `concurrency` ci-dessous.
    - cron: "43 6 * * *"
  workflow_dispatch:    # à la main depuis l'onglet Actions, ou par l'API
                        # (c'est ce que fait le bouton du dashboard)

# Jamais deux imports à la fois : ils écriraient le même fichier sur Drive.
concurrency:
  group: import-quotidien
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Rscript import_quotidien.R

    # Les secrets vivent dans l'environnement GitHub « SECRET » : un job qui ne
    # le déclare pas les lit comme des chaînes vides.
    environment: SECRET

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Tout le socle : global.R charge tout R/.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::bslib
            any::shinyjs
            any::shinyWidgets
            any::shinybusy
            any::dplyr
            any::ggplot2
            any::tidyr
            any::purrr
            any::stringr
            any::tibble
            any::lubridate
            any::googledrive
            any::googlesheets4
            any::readxl
            any::scales
            any::plotly
            any::forecast
            any::DT
            any::zoo
            any::patchwork
            any::cli
            any::httr
            any::jsonlite
            any::calendar
            any::janitor
            any::htmlwidgets

      - name: Lancer l'import
        env:
          LINK_JSON:      ${{ secrets.LINK_JSON }}
          PATH_DRIVE:     ${{ secrets.PATH_DRIVE }}
          ID_DRIVE_PATHS: ${{ secrets.ID_DRIVE_PATHS }}
          ODOO_URL:       ${{ secrets.ODOO_URL }}
          ODOO_DB:        ${{ secrets.ODOO_DB }}
          ODOO_LOGIN:     ${{ secrets.ODOO_LOGIN }}
          ODOO_CLE_API:   ${{ secrets.ODOO_CLE_API }}
        run: Rscript import_quotidien.R
